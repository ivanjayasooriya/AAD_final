version: '3.8'

services:
  mysqldb:
    image: mysql:8.0
    container_name: harmoniq-mysql
    restart: always
    environment:
      MYSQL_DATABASE: harmoniqdb
      MYSQL_ROOT_PASSWORD: mysql
      MYSQL_USER: root
      MYSQL_PASSWORD: mysql
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

volumes:
  mysql_data: