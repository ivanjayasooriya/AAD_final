<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>HarmoniQ | Banned Users</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link rel="stylesheet" href="css/user-management.css">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
</head>

<body class="bg-light p-4">

<div class="container">

    <!-- Header -->
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 class="fw-bold mb-0 text-danger">Banned Users</h2>

        <a href="user-management.html" class="btn btn-outline-secondary">
            <i class="bi bi-arrow-left me-2"></i> Back
        </a>
    </div>

    <!-- Table -->
    <div class="card border-0 shadow-sm">
        <div class="table-responsive">
            <table class="table table-hover align-middle mb-0" id="bannedTable">
                <thead class="table-light">
                <tr class="small text-uppercase">
                    <th>Username</th>
                    <th>Email</th>
                    <th class="text-end">Actions</th>
                </tr>
                </thead>
                <tbody></tbody>
            </table>
        </div>
    </div>

</div>

<!-- 🔍 Check Modal -->
<div class="modal fade" id="checkModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content border-0 shadow">

            <div class="modal-header">
                <h5 class="modal-title fw-bold">Ban Details</h5>
                <button class="btn-close" data-bs-dismiss="modal"></button>
            </div>

            <div class="modal-body">
                <input type="hidden" id="checkUserId">

                <p><strong>Username:</strong> <span id="checkUsername"></span></p>
                <p><strong>Email:</strong> <span id="checkEmail"></span></p>
                <p><strong>Banned Reason:</strong> <span id="banReason"></span></p>

                <div class="mb-3">
                    <label class="fw-bold small text-muted">User Message</label>
                    <div class="border rounded p-2 bg-light" id="checkMessage">
                        No message
                    </div>
                </div>
            </div>

            <div class="modal-footer border-0">
                <button class="btn btn-success w-100" onclick="unbanUser()">
                    Unban User
                </button>
            </div>

        </div>
    </div>
</div>

<!-- 🔄 Extend Ban Modal (reuse your existing structure) -->
<div class="modal fade" id="extendModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content border-0 shadow">

            <div class="modal-header">
                <h5 class="modal-title fw-bold text-warning">Extend Ban</h5>
                <button class="btn-close" data-bs-dismiss="modal"></button>
            </div>

            <div class="modal-body p-4">

                <input type="hidden" id="extendUserId">

                <div class="mb-3">
                    <label class="form-label small fw-bold text-muted">Ban Duration</label>
                    <select id="extendDuration" class="form-select">
                        <option value="24h">24 Hours</option>
                        <option value="7d">7 Days</option>
                        <option value="30d">30 Days</option>
                        <option value="1y">1 Year</option>
                        <option value="permanent">Permanent</option>
                    </select>
                </div>

                <div>
                    <label class="form-label small fw-bold text-muted">Reason</label>
                    <textarea id="extendReason" class="form-control" rows="2"></textarea>
                </div>

            </div>

            <div class="modal-footer border-0">
                <button class="btn btn-warning w-100 fw-bold" onclick="extendBan()">
                    Extend Ban
                </button>
            </div>

        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

<script src="js/banned-users.js"></script>

</body>
</html>
