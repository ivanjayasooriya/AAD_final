<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Account Banned</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

    <style>
        body {
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            background-color: #f8f9fa;
        }

        .center-content {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            flex-direction: column;
        }

        .ban-title {
            font-size: 3rem;
            font-weight: 800;
            color: #dc3545;
        }

        .ban-sub {
            font-size: 1.1rem;
            color: #6c757d;
        }
    </style>
</head>

<body>

<!-- CENTER MESSAGE -->
<div class="center-content">
    <div>
        <div class="ban-title mb-3">
            🚫 You Are Banned
        </div>

        <div class="ban-sub mb-3" id="banReasonText">
            Your account has been restricted.
        </div>

        <div class="text-muted small" id="banExpiryText">
            <!-- Optional expiry info -->
        </div>
    </div>
</div>

<!-- APPEAL INPUT -->
<div class="container mb-4">
    <div class="card shadow-sm border-0">
        <div class="card-body">
            <label class="fw-bold small text-muted mb-2">
                Request Unban / Contact Admin
            </label>

            <textarea id="appealMessage" class="form-control mb-3"
                      rows="2"
                      placeholder="Explain why you should be unbanned..."></textarea>

            <button class="btn btn-danger w-100 fw-bold" onclick="sendAppeal()">
                Send Appeal
            </button>
            <button class="btn btn-outline-secondary w-100 fw-bold mt-2" onclick="goToLogin()">
                Back to Login
            </button>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

<script src="js/ban-page.js"></script>
</body>
</html>
